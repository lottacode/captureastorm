<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Capture A Storm Photography — Maternity, children, pets, and aerial & sports photography. Book your session or access your private client proof gallery.">
    <meta property="og:title" content="Capture A Storm Photography">
    <meta property="og:description" content="Capturing life's precious moments — maternity, children, pets, and aerial & sports photography.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://captureastorm.co.uk">
    <meta property="og:image" content="https://captureastorm.co.uk/logo-transparent-colour.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="logo-transparent-colour.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <title>Capture A Storm Photography</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            background-color: #f8f8f8;
            scroll-behavior: smooth;
            /* padding-top: 80px; */
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', Georgia, serif;
        }

        .container {
            max-width: 2400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: linear-gradient(135deg,#2c3e50, #34495e);
            color: white;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-width: 100%;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #cbc2ed, #adbce1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            filter: invert();
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            padding: 10px;
            z-index: 1001;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            transition: 0.3s;
            border-radius: 2px;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(-45deg) translate(-5px, 6px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(45deg) translate(-5px, -6px);
        }

        .nav-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(135deg, #2c3e50bb, #34495ebb);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 90px 0 2rem;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transition: right 0.3s ease;
            z-index: 1000;
        }

        .nav-menu.active {
            right: 0;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 500;
            margin: 0.35rem 0;
            padding: 0.85rem 2rem;
            border-radius: 25px;
            transition: all 0.3s ease;
            width: 80%;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-menu a:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(-5px);
        }

        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .nav-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .page {
            display: none;
            min-height: 100vh;
            padding-top: 80px;
        }

        .page.active {
            display: block;
        }

        .hero {
            height: calc(100vh - 80px);
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
                        url('https://www.dropbox.com/scl/fi/228sve25135t1tsue05vh/IMG_4785-2.jpg?rlkey=00tqfpqnblbongbqrzax44cf1&st=xgvxhz78&raw=1') no-repeat center center;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            margin-top: 0px;
        }

        .hero-content h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease 0.3s both;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(45deg, #e74c3c, #f39c12);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
            animation: fadeInUp 1s ease 0.6s both;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.3);
        }

        .page-header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 4rem 0 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .page-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        section {
            padding: 80px 0;
        }

        h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        /* Masonry layout for portfolio — handles mixed portrait/landscape cleanly */
        .gallery-grid.masonry {
            display: block;
            columns: 3;
            column-gap: 15px;
        }

        .gallery-grid.masonry .gallery-item {
            break-inside: avoid;
            margin-bottom: 15px;
            display: block;
        }

        .gallery-grid.masonry .gallery-item img {
            height: auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            align-content: center;
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            object-fit: scale-down;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.8), rgba(243, 156, 18, 0.8));
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-overlay h3 {
            color: white;
            font-size: 1.5rem;
            text-align: center;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .package-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .package-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #e74c3c, #f39c12);
        }

        .package-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.15);
        }

        .package-card h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .price {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 1rem;
        }

        .package-features {
            list-style: none;
            margin-bottom: 2rem;
        }

        .package-features li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .review-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .review-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #e74c3c, #f39c12);
        }

        .review-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.15);
        }

        .stars {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #f39c12;
        }

        .review-text {
            font-style: italic;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #666;
            margin-bottom: 2rem;
            text-align: center;
        }

        .reviewer-info {
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }

        .reviewer-name {
            font-weight: bold;
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .review-session {
            color: #e74c3c;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-section {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
        }

        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.9);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.3);
            transform: translateY(-2px);
        }

        .submit-btn {
            background: linear-gradient(45deg, #e74c3c, #f39c12);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.3);
        }

        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
        }

        .modal img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            object-fit: scale-down;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #f39c12;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-grid.masonry {
                columns: 2;
            }

            h2 {
                font-size: 2rem;
            }

            .nav-menu {
                width: 100%;
            }
        }

        .description-text {
            max-width: 800px;
            margin: 0 auto 3rem;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #666;
        }

        /* Portfolio items — no colour overlay, zoom cursor on hover */
        .portfolio-item {
            cursor: zoom-in;
        }

        .portfolio-item:hover {
            transform: none;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* Portfolio skeleton loading */
        @keyframes shimmer {
            0%   { background-position: -600px 0; }
            100% { background-position:  600px 0; }
        }

        .skeleton {
            border-radius: 15px;
            background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
            background-size: 600px 100%;
            animation: shimmer 1.4s infinite linear;
            break-inside: avoid;
            margin-bottom: 15px;
        }

        /* Fade in images as they load */
        .gallery-grid.masonry .gallery-item img {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .gallery-grid.masonry .gallery-item img.loaded {
            opacity: 1;
        }

        /* Client Gallery */
        .cg-section {
            padding: 3rem 0 5rem;
        }

        .cg-login-card {
            max-width: 480px;
            margin: 0 auto;
        }

        .cg-password-wrap {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .cg-password-wrap input {
            flex: 1;
        }

        .cg-toggle-pw {
            background: #eef1f6;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            font-weight: 600;
            color: #2c3e50;
        }

        .cg-error {
            color: #e74c3c;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: 600;
        }

        .cg-session-banner {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid #e1e8ed;
        }

        .cg-secondary-btn {
            background: white;
            color: #2c3e50;
            border: 2px solid #2c3e50;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cg-secondary-btn:hover {
            background: #2c3e50;
            color: white;
        }

        .cg-toolbar {
            position: sticky;
            top: 85px;
            z-index: 900;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .cg-counter {
            font-size: 1.15rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .cg-counter #cg-selected-count {
            color: #e74c3c;
            font-size: 1.3rem;
        }

        .cg-toolbar-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .cg-filter-btn {
            background: #eef1f6;
            color: #2c3e50;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cg-filter-btn.active {
            background: #2c3e50;
            color: white;
        }

        .cg-submit-trigger {
            padding: 10px 24px;
            font-size: 1rem;
        }

        .cg-submit-trigger:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .cg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .cg-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .cg-card.selected {
            border-color: #e74c3c;
            box-shadow: 0 12px 32px rgba(231, 76, 60, 0.18);
        }

        .cg-thumb-wrap {
            position: relative;
            background: #1a252f;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            cursor: zoom-in;
            user-select: none;
        }

        .cg-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .cg-watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.28);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            transform: rotate(-22deg);
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
            text-transform: uppercase;
        }

        .cg-card-footer {
            padding: 0.9rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cg-card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .cg-filename {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2c3e50;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cg-select-btn {
            background: #eef1f6;
            color: #2c3e50;
            border: none;
            padding: 7px 14px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .cg-select-btn.selected {
            background: linear-gradient(45deg, #e74c3c, #f39c12);
            color: white;
        }

        .cg-note-input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #2c3e50;
        }

        .cg-note-input:focus {
            outline: none;
            border-color: #99aaf4;
        }

        .cg-lb-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .cg-lb-img-wrap {
            position: relative;
            max-height: 78vh;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .cg-lb-img-wrap img {
            max-width: 85vw;
            max-height: 78vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .cg-lb-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            color: white;
            background: rgba(44, 62, 80, 0.85);
            padding: 8px 18px;
            border-radius: 50px;
        }

        .cg-lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 12px 16px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2010;
        }

        .cg-lb-prev { left: 20px; }
        .cg-lb-next { right: 20px; }

        .cg-submit-modal {
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        .cg-submit-dialog {
            position: relative;
            background: white;
            max-width: 600px;
            margin: 2rem auto;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            color: #2c3e50;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .cg-dialog-close {
            color: #2c3e50;
            top: 14px;
            right: 22px;
        }

        .cg-review-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .cg-review-item {
            padding: 4px 0;
            font-size: 0.95rem;
            border-bottom: 1px solid #eee;
        }

        .cg-review-item:last-child {
            border-bottom: none;
        }

        .cg-review-note {
            color: #666;
            font-style: italic;
        }

        .cg-submit-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 1rem;
        }

        .cg-submit-status {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .cg-submit-status.success {
            background: #e8f8f0;
            color: #1e7e4c;
        }

        .cg-submit-status.error {
            background: #fdecea;
            color: #c0392b;
        }

        /* Admin Dashboard */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .admin-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .admin-card {
            background: white;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <img src="https://www.dropbox.com/scl/fi/3ajvk35m9zs3nunocioma/FF9118F1-7D0C-4186-8DBC-587B1364310B.png?rlkey=kyb16dbk8yhj1ikxwx1gh9xyd&st=4avmsaxu&raw=1" alt="Logo" class="logo" onclick="showPage('Home')" height="75">
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <div class="nav-overlay" onclick="closeMenu()"></div>
    <div class="nav-menu">
        <a href="#Home" onclick="showPage('Home'); return false;">Home</a>
        <a href="#Maternity" onclick="showPage('Maternity'); return false;">Maternity</a>
        <a href="#Adults" onclick="showPage('Adults'); return false;">Aerial &amp; Sports</a>
        <a href="#Kids" onclick="showPage('Kids'); return false;">Children</a>
        <a href="#Pets" onclick="showPage('Pets'); return false;">Pets</a>
        <a href="#Portfolio" onclick="showPage('Portfolio'); return false;">Portfolio</a>
        <a href="#Packages" onclick="showPage('Packages'); return false;">Packages</a>
        <a href="#Reviews" onclick="showPage('Reviews'); return false;">Reviews</a>
        <a href="#ClientDetails" onclick="showPage('ClientDetails'); return false;">Client Details</a>
        <a href="#ClientGallery" onclick="showPage('ClientGallery'); return false;">Client Gallery</a>
        <a href="#Contact" onclick="showPage('Contact'); return false;">Contact</a>
    </div>

    <div id="Home"      class="page active"></div>
    <div id="Maternity" class="page"></div>
    <div id="Adults"    class="page"></div>
    <div id="Kids"      class="page"></div>
    <div id="Pets"      class="page"></div>
    <div id="Portfolio" class="page"></div>
    <div id="Packages"  class="page"></div>
    <div id="Reviews"   class="page"></div>
    <div id="ClientDetails" class="page"></div>
    <div id="ClientGallery" class="page"></div>
    <div id="Admin"     class="page"></div>
    <div id="Contact"   class="page"></div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Capture A Storm Photography. All rights reserved.</p>
            <p>Creating beautiful memories, one shot at a time. &bull; <a href="#Admin" onclick="showPage('Admin')" style="color: #99aaf4; text-decoration: none;">Admin</a></p>
        </div>
    </footer>

    <!-- Modal for enlarged images -->
    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="">
        </div>
    </div>

    <script src="js/clientgallery.js"></script>
    <script src="js/admin.js"></script>
    <script>
        let currentPage = 'Home';
        let portfolioLoaded = false;

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

        // Load a page's HTML from pages/ and inject it
        async function loadPage(pageId) {
            const container = document.getElementById(pageId);
            const res = await fetch(`pages/${pageId.toLowerCase()}.html`);
            container.innerHTML = await res.text();

            // Wire up scroll animations for newly added items
            container.querySelectorAll('.gallery-item, .package-card').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(30px)';
                el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                observer.observe(el);
            });

            // Attach contact form handler once the form exists in the DOM
            if (pageId === 'Contact') {
                document.getElementById('contactForm').addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const form = this;
                    const data = Object.fromEntries(new FormData(form));
                    const btn = document.getElementById('contact-submit-btn');
                    const statusEl = document.getElementById('contact-status');

                    btn.disabled = true;
                    btn.textContent = 'Sending...';
                    statusEl.style.display = 'none';

                    try {
                        const res = await fetch('/api/contact', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: data.name,
                                email: data.email,
                                phone: data.phone,
                                sessionType: data['session-type'],
                                packageType: data['package-type'],
                                message: data.message,
                            }),
                        });
                        const json = await res.json();
                        if (!res.ok) throw new Error(json.error || 'Could not send message.');

                        statusEl.textContent = 'Thank you for your inquiry! I have received your message and will reply soon.';
                        statusEl.className = 'cg-submit-status success';
                        statusEl.style.display = 'block';
                        form.reset();
                    } catch (err) {
                        statusEl.textContent = err.message || 'Could not send message. Please email captureastorm@gmail.com directly.';
                        statusEl.className = 'cg-submit-status error';
                        statusEl.style.display = 'block';
                    } finally {
                        btn.disabled = false;
                        btn.textContent = 'Send Message';
                    }
                });
            }

            if (pageId === 'ClientGallery' && window.initClientGallery) {
                window.initClientGallery();
            }

            if (pageId === 'Admin' && window.initAdminPage) {
                window.initAdminPage();
            }
        }

        // Fetch all pages in parallel on load so navigation is instant
        const pages = ['Home', 'Maternity', 'Adults', 'Kids', 'Pets', 'Portfolio', 'Packages', 'Reviews', 'ClientDetails', 'ClientGallery', 'Admin', 'Contact'];
        Promise.all(pages.map(loadPage)).then(() => {
            // After all pages loaded, navigate to hash if present
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById(hash)) showPage(hash);
        });

        function showPage(pageId, options = {}) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            currentPage = pageId;
            closeMenu();
            window.scrollTo(0, 0);
            window.location.hash = pageId;
            if (pageId === 'Portfolio') loadPortfolioImages();
            if (pageId === 'Contact' && options.packageType) {
                const pkgSelect = document.getElementById('package-type');
                if (pkgSelect) pkgSelect.value = options.packageType;
            }
        }

        async function loadPortfolioImages() {
            if (portfolioLoaded) return;
            const grid = document.getElementById('portfolio-grid');
            try {
                const res = await fetch('portfolio.json');
                if (!res.ok) throw new Error('Failed to load portfolio.json');
                const urls = await res.json();

                if (!urls.length) {
                    grid.innerHTML = '<p style="text-align:center;padding:2rem;color:#666;">No images found.</p>';
                    return;
                }

                // Render skeletons upfront — each stores its URL in a data attribute
                grid.innerHTML = '';
                const skeletonHeights = [260, 340, 220, 300, 280, 250, 320, 240, 360, 270];
                urls.forEach((url, i) => {
                    const skel = document.createElement('div');
                    skel.className = 'skeleton';
                    skel.style.height = skeletonHeights[i % skeletonHeights.length] + 'px';
                    skel.dataset.src = url;
                    grid.appendChild(skel);
                });

                // Replace each skeleton with its image only when it scrolls into view
                const lazyLoader = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        const skel = entry.target;
                        obs.unobserve(skel);
                        const img = new Image();
                        img.onload = () => {
                            const item = document.createElement('div');
                            item.className = 'gallery-item portfolio-item';
                            item.onclick = function() { openModal(this); };
                            item.innerHTML = `<img src="${skel.dataset.src}" class="loaded">`;
                            item.style.opacity = '0';
                            item.style.transform = 'translateY(20px)';
                            item.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                            skel.replaceWith(item);
                            observer.observe(item);
                        };
                        img.src = skel.dataset.src;
                    });
                }, { rootMargin: '200px' });

                grid.querySelectorAll('.skeleton').forEach(skel => lazyLoader.observe(skel));

                portfolioLoaded = true;
            } catch (err) {
                grid.innerHTML = `<p style="text-align:center;padding:2rem;color:#e74c3c;">Could not load portfolio images. Please try again later.</p>`;
                console.error('Portfolio load error:', err);
            }
        }

        function toggleMenu() {
            document.querySelector('.hamburger').classList.toggle('active');
            document.querySelector('.nav-menu').classList.toggle('active');
            document.querySelector('.nav-overlay').classList.toggle('active');
        }

        function closeMenu() {
            document.querySelector('.hamburger').classList.remove('active');
            document.querySelector('.nav-menu').classList.remove('active');
            document.querySelector('.nav-overlay').classList.remove('active');
        }

        function openModal(element) {
            const img = element.querySelector('img');
            document.getElementById('modalImage').src = img.src;
            document.getElementById('modalImage').alt = img.alt;
            document.getElementById('imageModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        window.addEventListener('hashchange', function() {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById(hash)) showPage(hash);
        });

        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (window.scrollY > 100) {
                header.style.background = 'rgba(44, 62, 80, 0.95)';
                header.style.backdropFilter = 'blur(10px)';
            } else {
                header.style.background = 'linear-gradient(135deg, #2c3e50, #34495e)';
                header.style.backdropFilter = 'none';
            }
        });
    </script>
</body>
</html>
